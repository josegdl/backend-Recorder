spring.application.name=backend-recorder

# Binarios de captura ubicados en la raiz del proyecto.
recorder.ffmpeg.path=${user.dir}/ffmpeg.exe
recorder.yt-dlp.path=${user.dir}/yt-dlp.exe

# Carpeta de salida de las grabaciones.
recorder.output-dir=${user.dir}/recordings
recorder.timezone=system

# Scheduler por bloques alineados (emparejamiento con el reloj). enabled=true arranca al iniciar la app.
# tick-seconds: cada cuanto se reconcilia el estado (corte/arranque por bloque).
recorder.scheduler.enabled=false
recorder.scheduler.pool-size=2
recorder.scheduler.tick-seconds=1

# Reconexion automatica (max-attempts=0 => reintentos ilimitados).
recorder.reconnect.max-attempts=0
recorder.reconnect.initial-delay=1s
recorder.reconnect.max-delay=30s

# Origenes permitidos para el frontend React en desarrollo.
recorder.cors.allowed-origin-patterns=http://localhost:[*],http://127.0.0.1:[*]

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE

# Ventana permitida directa (alternativa a exclusiones): graba de 05:00 a 02:00.
# recorder.channels[0].allowed-windows[0].start=05:00
# recorder.channels[0].allowed-windows[0].end=02:00

# Exclusions (listas 1 y 2, union). Se excluye el hueco 02:00-05:00,
# por lo que se graba de 05:00 a 02:00 del dia siguiente (21 bloques).
# recorder.channels[0].exclusion-list1[0].start=02:00
# recorder.channels[0].exclusion-list1[0].end=05:00
# Solo un dia:
# recorder.channels[0].exclusion-list1[1].day-of-week=SATURDAY
# recorder.channels[0].exclusion-list1[1].start=00:00
# recorder.channels[0].exclusion-list1[1].end=06:00

# Canales iniciales (opcional). Descomenta y ajusta para pruebas locales.
recorder.channels[0].id=1
recorder.channels[0].name=ADN40
recorder.channels[0].source-url=https://mdstrm.com/live-stream-playlist/60b578b060947317de7b57ac.m3u8
recorder.channels[0].protocol=M3U8_HLS
recorder.channels[0].enabled=true
recorder.channels[0].format=mp3
# Duracion de bloque por canal en minutos
recorder.channels[0].block-duration-minutes=10
# Bloqueo horario compacto: todos los dias de 02:00 a 05:00
recorder.channels[0].schedule-window=8>2-5

recorder.channels[1].id=2
recorder.channels[1].name=WEBCDMX_FM-103-3
recorder.channels[1].source-url=https://mdstrm.com/live-stream-playlist/60b578b060947317de7b57ac.m3u8
recorder.channels[1].protocol=M3U8_HLS
recorder.channels[1].enabled=true
recorder.channels[1].format=MKV
recorder.channels[1].block-duration-minutes=10
recorder.channels[1].schedule-window=8>2-5
